{% macro responsive_ad(slot, placement) -%}
{% if slot %}
<aside class="shell adsense-slot adsense-slot--{{ placement }} google-auto-ads-ignore" aria-label="Advertisement">
    <span class="adsense-slot-label">Advertisement</span>
    <ins class="adsbygoogle"
         style="display:block"
         data-ad-client="{{ adsense_client }}"
         data-ad-slot="{{ slot }}"
         data-ad-format="auto"
         data-full-width-responsive="true"></ins>
</aside>
{% endif %}
{%- endmacro %}
