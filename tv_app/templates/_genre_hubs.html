{% if genre_hubs %}
<nav class="genre-hubs" aria-label="Browse by genre">
    {% for genre, title_count in genre_hubs %}
    <a href="{{ genre_url(category_key, genre) }}">
        <span>{{ genre.name }}</span>{% if title_count is not none %}<small>{{ title_count }}</small>{% endif %}
    </a>
    {% endfor %}
</nav>
{% endif %}
