; Legacy Supervisor layout for existing iBOX TV hosts.  New VPS installs use
; the systemd units in deploy/systemd/ instead.

[program:ibox-celery-worker]
directory=/root/tvweb-current
command=/root/tvweb/venv/bin/celery -A tv_app.tasks worker -l info -Q ingestion,movies,maintenance -c 1 --max-tasks-per-child=100 --max-memory-per-child=160000 --without-gossip --without-mingle
user=root
autostart=true
autorestart=true
startsecs=10
stopasgroup=true
killasgroup=true
stderr_logfile=/var/log/supervisor/ibox-celery-worker-err.log
stdout_logfile=/var/log/supervisor/ibox-celery-worker-out.log

[program:ibox-celery-beat]
directory=/root/tvweb-current
command=/root/tvweb/venv/bin/celery -A tv_app.tasks beat -l info --schedule=/root/tvweb/celerybeat-schedule-v2
user=root
autostart=true
autorestart=true
startsecs=10
stopasgroup=true
killasgroup=true
stderr_logfile=/var/log/supervisor/ibox-celery-beat-err.log
stdout_logfile=/var/log/supervisor/ibox-celery-beat-out.log
